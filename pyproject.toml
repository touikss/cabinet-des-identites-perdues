[project]
name = "cabinet"
version = "0.1.0"
description = "Historical deduction game played against a multi-agent LLM system (Claude Sonnet + Haiku)."
readme = "README.md"
authors = [
    { name = "Théodore Deguest", email = "theodore.dgst@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.3.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/cabinet/prompts.py" = ["E501"]  # prompts: long natural-language lines
